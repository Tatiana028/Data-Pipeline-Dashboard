[project]
name = "data-pipeline-dashboard"
version = "0.1.0"
description = "Scheduled weather ETL into PostgreSQL with FastAPI and Streamlit"
requires-python = ">=3.12"

dependencies = [

    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    # БД
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Дашборд
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]